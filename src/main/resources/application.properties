spring.application.name=rota-folego-api

# Render informa a porta pela variavel PORT; localmente usa 8080
server.port=${PORT:8080}

# Banco Oracle: NENHUM usuario/senha no codigo. Tudo vem de variaveis de ambiente.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Pool pequeno (o Oracle da FIAP limita conexoes por aluno) e API sobe mesmo se o banco demorar
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.initialization-fail-timeout=-1

# CORS: origens do front separadas por virgula (aceita curinga, ex.: https://*.vercel.app)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Datas em ISO-8601 (2026-09-01T10:00:00) e nunca mostrar stack trace
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-stacktrace=never
server.error.include-message=never
